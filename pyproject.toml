[project]
name = "todo-api"
version = "0.3.0"
description = "A small REST API for to-do tasks"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "BLE"]

[tool.mutmut]
source_paths = ["src/todo/"]
only_mutate = ["src/todo/services/*"]
also_copy = ["migrations/"]
pytest_add_cli_args_test_selection = ["tests/"]
